<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>결혼식에 초대합니다</title>
    <link rel="stylesheet" href="wedding.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section with Main Photo -->
    <section class="hero-section">
        <div class="hero-image parallax" data-speed="0.5">
            <img src="photos/main-hero.png" alt="Wedding" loading="eager">
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content parallax" data-speed="0.3">
            <h1 class="couple-names">
                <span class="name-left">상건</span>
                <span class="name-divider"></span>
                <span class="name-right">기정</span>
            </h1>
            <div class="wedding-date">2026.10.10</div>
        </div>
    </section>

    <!-- Time Section -->
    <section class="section time-section" id="time">
        <div class="section-container">
            <h2 class="section-title">시간</h2>
            <div class="time-card">
                <div class="calendar-icon">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <text x="12" y="17" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">10</text>
                    </svg>
                </div>
                <div class="time-details">
                    <p class="time-main">2026년 10월 10일 (토)</p>
                    <p class="time-sub">낮 12시 30분</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Location Section -->
    <section class="section location-section" id="location">
        <div class="section-container">
            <h2 class="section-title">장소</h2>
            <div class="location-card">
                <h3>뜰안채2</h3>
                <div class="map-thumbnail">
                    <iframe src="https://naver.me/58NdJdKu" width="100%" height="250" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" title="지도"></iframe>
                </div>
                <div class="map-links">
                    <a href="https://naver.me/58NdJdKu" target="_blank" class="map-link naver">네이버 지도</a>
                    <a href="https://kko.to/fIZuzMIdcQ" target="_blank" class="map-link kakao">카카오T</a>
                    <a href="https://tmap.life/13d81b31" target="_blank" class="map-link tmap">T맵</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Album Section -->
    <section class="section album-section" id="album">
        <div class="section-container">
            <h2 class="section-title">앨범</h2>
            <div class="album-grid">
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_01.jpg" alt="사진1" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_02.jpg" alt="사진2" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_03.jpg" alt="사진3" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_04.jpg" alt="사진4" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_05.jpg" alt="사진5" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_06.jpg" alt="사진6" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_07.jpg" alt="사진7" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_08.jpg" alt="사진8" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_09.jpg" alt="사진9" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_10.jpg" alt="사진10" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_11.jpg" alt="사진11" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_12.jpg" alt="사진12" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_13.jpg" alt="사진13" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_14.jpg" alt="사진14" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_15.jpg" alt="사진15" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_16.jpg" alt="사진16" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_17.jpg" alt="사진17" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_18.jpg" alt="사진18" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_19.jpg" alt="사진19" loading="lazy"></div>
                <div class="album-item"><img src="photos/KakaoTalk_20260512_210645844_20.jpg" alt="사진20" loading="lazy"></div>
            </div>
        </div>
    </section>

    <!-- Account Section -->
    <section class="section account-section" id="account">
        <div class="section-container">
            <h2 class="section-title">마음을 전하는 곳</h2>
            <div class="account-cards">
                <div class="account-card" data-account="groom">
                    <div class="account-header">
                        <div class="account-names">
                            <span class="account-role">신랑</span>
                            <span class="account-person">김상건</span>
                        </div>
                        <button class="copy-btn" data-clipboard="123-456-789" title="복사">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="account-details">
                        <p class="bank-name">국민은행</p>
                        <p class="account-number">123-456-789</p>
                    </div>
                </div>
                <div class="account-card" data-account="bride">
                    <div class="account-header">
                        <div class="account-names">
                            <span class="account-role">신부</span>
                            <span class="account-person">윤기정</span>
                        </div>
                        <button class="copy-btn" data-clipboard="987-654-321" title="복사">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="account-details">
                        <p class="bank-name">하나은행</p>
                        <p class="account-number">987-654-321</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Guestbook Section -->
    <section class="section guestbook-section" id="guestbook">
        <div class="section-container">
            <h2 class="section-title">방명록</h2>
            <p class="section-desc">축하 메시지와 사진을 남겨주세요!</p>
            <form id="guestbookForm" class="guestbook-form">
                <div class="form-group">
                    <input type="text" id="guestName" placeholder="이름" required>
                </div>
                <div class="form-group">
                    <textarea id="guestMessage" placeholder="축하 메시지를 남겨주세요" rows="4" required></textarea>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="guestPhoto" accept="image/*">
                    <label for="guestPhoto" class="file-label">
                        <span class="upload-icon">📷</span>
                        <span>사진 추가 (선택사항)</span>
                    </label>
                </div>
                <div class="upload-name" id="fileName">선택된 파일 없음</div>
                <div class="upload-preview" id="uploadPreview"></div>
                <button type="submit" class="upload-btn">방명록 남기기</button>
            </form>
            <div id="guestbookStatus" class="upload-status"></div>
            
            <div class="guestbook-entries" id="guestbookEntries"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>두 사람의 새로운 시작을 함께 축복해 주세요</p>
        <p class="footer-hearts">💕</p>
        <p class="footer-copy">© 2026 상건 & 기정</p>
    </footer>

    <script src="wedding.js"></script>
</body>
</html>
